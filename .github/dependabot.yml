# Keeps the pinned base image current: a pull request for each new Node 22 or
# Debian bookworm release of the Dockerfile's NODE_IMAGE (pinned by digest).
# CI tests it like any change; .nvmrc follows the same minor by hand.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # A new major (Node 24) is a decision of its own (ROADMAP), not a weekly bump.
      - dependency-name: node
        update-types: ['version-update:semver-major']
