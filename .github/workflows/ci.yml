name: CI

# First real correctness gate for framer-clone. Runs the full local verify
# suite on every push and PR to main: typecheck, lint, unit tests, build, and
# the Dockerized Postgres integration tests (which run nowhere today). The
# integration globalSetup boots its own throwaway Postgres via testcontainers,
# so the runner only needs a working Docker daemon (ubuntu-latest ships one).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref so a fresh push does not queue behind
# a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap-check:
    name: roadmap-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30

  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # Dummy connection string for the steps that only need the generated
      # Prisma client or the Next build; none of these connect. The integration
      # globalSetup (vitest.integration.setup.ts) owns the real test database and
      # overrides DATABASE_URL at run time, exactly as it does locally. The same
      # globalSetup also owns COMMERCE_APP_DATABASE_URL (it provisions the
      # commerce_app role + the demo tg_<demo> schema on its container and
      # exports the URL), so do NOT add a static commerce URL here.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/framer_clone_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager" (pnpm@9.15.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The same major as the production image (Dockerfile NODE_IMAGE) and package.json engines.
          node-version-file: .nvmrc
          cache: pnpm

      # Tenant isolation guards (G1 to G5) over all of src and scripts: no bare
      # or literally qualified commerce table in any SQL template (Kysely or
      # postgres.js), no raw SQL strings, no .withSchema, no runtime
      # search_path SET. A plain node script with no dependencies, so it runs
      # before the install and a violation fails the job in seconds.
      - name: Tenant isolation guards
        run: pnpm lint:guards

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # postinstall already runs prisma generate, but keep it explicit so the
      # client is guaranteed present before typecheck and build.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Boots a throwaway Postgres via testcontainers and runs prisma migrate
      # deploy before the suite. Docker is preinstalled on ubuntu-latest.
      - name: Integration tests
        run: pnpm test:integration

      # db-types.ts is generated from the live tenant DDL (scripts/commerce-codegen.ts).
      # A hand edit, or a migration without a regenerated file, fails here: it drifted
      # once (010) before this check existed.
      - name: Database types match the migrations
        run: pnpm db:codegen-commerce && git diff --exit-code src/server/commerce/db-types.ts

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    # `pnpm build` above does not apply .dockerignore, so a Docker-only build
    # break (a prod import stripped by .dockerignore, for example) can be green
    # here and still fail at deploy. This job builds the real production image
    # (no push, no secrets: the Dockerfile bakes none in) so that class of
    # break fails in CI instead. Filed after `scripts/seed-demo.ts` imported a
    # test-only helper that .dockerignore strips, breaking the Docker build
    # while the verify job stayed green (fixed in #48).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
