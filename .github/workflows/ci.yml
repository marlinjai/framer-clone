name: CI

# The pull request tier (plan: knowledge-base docs/plans/2026-11-27-ci-under-ten-minutes.md, standard
# standards/ci-cd-speed.md section 0.5): about five minutes at the median, at most ten. Typecheck, lint, the
# unit tests in shards, the Dockerized Postgres integration tests (their globalSetup boots a throwaway Postgres
# through testcontainers; ubuntu-latest ships Docker), the build, a real `docker build`, and the two long proofs
# in the form the change can affect (proofs.yml). Every proof in full runs after the merge on main and at night
# (after-merge.yml), where a failure opens an issue.
#
# On a push to main only the fast jobs run here; the long proofs run in after-merge.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref so a fresh push does not queue behind
# a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap-check:
    name: roadmap-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30

  # Seconds, no install: the guards, the plugin, the score files.
  static:
    name: static
    runs-on: ubuntu-latest
    env:
      # Dummy connection string for the steps that only need the generated Prisma client; none of these connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/framer_clone_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base, for the score report guard.
          fetch-depth: 2

      # docs/primitives-score/latest.* is written only by the run on main (score.yml).
      # A pull request that carries it conflicts with every other one that ran the score;
      # what a pull request changes in the score shows in its baseline.json rows.
      - name: Score report is main's
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- docs/primitives-score/latest.json docs/primitives-score/latest.md; then
            echo "This pull request changes docs/primitives-score/latest.*, which only the run on main writes."
            echo "Put main's back: git checkout origin/main -- docs/primitives-score/latest.json docs/primitives-score/latest.md"
            exit 1
          fi

      # Reads the pnpm version from package.json "packageManager" (pnpm@9.15.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The same major as the production image (Dockerfile NODE_IMAGE) and package.json engines.
          node-version-file: .nvmrc
          cache: pnpm

      # Tenant isolation guards (G1 to G5) over all of src and scripts: no bare
      # or literally qualified commerce table in any SQL template (Kysely or
      # postgres.js), no raw SQL strings, no .withSchema, no runtime
      # search_path SET. A plain node script with no dependencies, so it runs
      # before the install and a violation fails the job in seconds.
      - name: Tenant isolation guards
        run: pnpm lint:guards

      # The lumitra-sites agent plugin (plugin/lumitra-sites) is a valid Agent
      # Plugin and the public mirror's Claude Code files (plugin/lumitra-sites-mirror)
      # carry its version, address and headers. Dependency free and offline: a pull
      # request is never compared with the mirror repository itself, which is synced
      # from main (sync-plugin-mirror.yml). That the skills name only real tools is
      # checked by the unit tests (src/server/mcp/__tests__/plugin.test.ts).
      - name: Agent plugin is valid
        run: ./scripts/sync-plugin-repo.sh --check-payload

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # postinstall already runs prisma generate, but keep it explicit so the
      # client is guaranteed present before typecheck.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # The primitive score's floor (docs/primitives-score/baseline.json) is sound: a
      # lowered row holds its reason. No browser, seconds. The floor against a run, row by
      # row, is checked by score.yml on main after each run.
      - name: Score floor is sound
        run: pnpm check:score-floor --sound-only

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  # 700 files took 600 s on one runner (2026-11-27); in three shards each is a third. The shards are vitest's
  # own (`--shard`), over both projects, so every file runs in exactly one of them.
  unit:
    name: unit (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/framer_clone_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "nproc $(nproc), $(free -g | awk '/Mem:/ {print $2}') GB memory"
          pnpm test --shard="$SHARD/3"

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # The Next build needs a connection string to be set, never a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/framer_clone_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      # The integration globalSetup (vitest.integration.setup.ts) owns the real test database and overrides
      # DATABASE_URL at run time, exactly as it does locally. The same globalSetup also owns
      # COMMERCE_APP_DATABASE_URL (it provisions the commerce_app role and the demo tg_<demo> schema on its
      # container and exports the URL), so do NOT add a static commerce URL here.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/framer_clone_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Boots a throwaway Postgres via testcontainers and runs prisma migrate
      # deploy before the suite. Docker is preinstalled on ubuntu-latest.
      - name: Integration tests
        run: pnpm test:integration

      # db-types.ts is generated from the live tenant DDL (scripts/commerce-codegen.ts).
      # A hand edit, or a migration without a regenerated file, fails here: it drifted
      # once (010) before this check existed.
      - name: Database types match the migrations
        run: pnpm db:codegen-commerce && git diff --exit-code src/server/commerce/db-types.ts

  # The check name the four jobs above stand for (the one job they were until 2026-11-27). `if: always()` so a
  # failed job never skips it: a skipped check reads as passed.
  verify:
    name: verify
    needs: [static, unit, build, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every verify job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "static, unit, build, integration: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    # `pnpm build` above does not apply .dockerignore, so a Docker-only build
    # break (a prod import stripped by .dockerignore, for example) can be green
    # here and still fail at deploy. This job builds the real production image
    # (no push, no secrets: the Dockerfile bakes none in) so that class of
    # break fails in CI instead. Filed after `scripts/seed-demo.ts` imported a
    # test-only helper that .dockerignore strips, breaking the Docker build
    # while the verify job stayed green (fixed in #48).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  # The render gate and the behaviour proofs, in the form this change can affect (proofs.yml says how it is
  # chosen). On a push to main they run in full in after-merge.yml instead.
  proofs:
    name: proofs
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/proofs.yml
    with:
      tier: pr
