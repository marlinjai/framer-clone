<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyframes</title>
<style>
  .page { font: 16px/1.5 Arial, sans-serif; padding: 24px; display: flex; gap: 16px; }
  @keyframes pulse { from { opacity: 1; transform: scale(1); } to { opacity: 0.2; transform: scale(0.6); } }
  .dot { width: 80px; height: 80px; border-radius: 50%; background: #1d4ed8; animation: pulse 1s linear infinite; }
</style>
</head>
<body style="margin:0">
<div class="page" data-parity-id="page">
  <div class="dot" data-parity-id="dot"></div>
</div>
</body>
</html>
