<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document styles</title>
<style>
  html { scroll-behavior: smooth; overflow-x: hidden; font-size: 20px; color: #1d4ed8; }
  :root { --accent: #b91c1c; --gap: ; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
  @media (max-width: 767.98px) {
    html { font-size: 16px; }
  }
  main { margin: 0; font-family: Arial, sans-serif; }
  .copy { width: 10rem; margin: 0; }
  .accent { color: var(--accent); filter: var(--gap) blur(1px); margin: 0; }
</style>
</head>
<body style="margin:0">
<main data-parity-id="page">
  <p class="copy" data-parity-id="copy">Sized from the document</p>
  <p class="accent" data-parity-id="accent">Coloured from the document</p>
</main>
</body>
</html>
