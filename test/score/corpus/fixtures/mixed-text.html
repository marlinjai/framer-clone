<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixed text</title>
<style>
  .page { font: 16px/1.5 Arial, sans-serif; color: #1f2937; padding: 24px; max-width: 640px; }
  .page a { color: #1d4ed8; }
</style>
</head>
<body style="margin:0">
<article class="page" data-parity-id="page">
  <h1 data-parity-id="title">Our <em data-parity-id="title-em">first</em> shop</h1>
  <p data-parity-id="lead">Hello <strong data-parity-id="lead-strong">bold</strong> and <a data-parity-id="lead-link" href="#more">a link</a> at the end of the sentence.</p>
  <ul data-parity-id="list">
    <li data-parity-id="item-1">Plain item</li>
    <li data-parity-id="item-2">Item with <code data-parity-id="item-code">code</code> inside</li>
  </ul>
</article>
</body>
</html>
