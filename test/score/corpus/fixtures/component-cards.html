<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component cards</title>
<style>
  .page { font: 16px/1.5 Arial, sans-serif; color: #111827; padding: 32px; }
  .title { font-size: 28px; line-height: 1.2; margin: 0 0 24px; }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { display: block; overflow: hidden; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; color: inherit; text-decoration: none; }
  .card-image { display: block; width: 100%; height: 120px; object-fit: cover; background: #e5e7eb; }
  .card-badge { display: inline-block; margin: 12px 16px 0; padding: 2px 8px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700; }
  .card-title { margin: 12px 16px 4px; font-size: 20px; line-height: 1.3; }
  .card-copy { margin: 0 16px 16px; color: #4b5563; }
  @media (max-width: 1279.98px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 767.98px) {
    .page { padding: 16px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .card-title { font-size: 18px; }
  }
</style>
</head>
<body style="margin:0">
<main class="page" data-parity-id="page">
  <h1 class="title" data-parity-id="title">Rooms</h1>
  <ul class="grid" data-parity-id="grid">
    <li data-parity-id="cell-1">
      <a class="card" href="/rooms/garden" data-parity-id="card">
        <img class="card-image" src="/images/garden.jpg" alt="Courtyard garden" data-parity-id="card-image">
        <span class="card-badge" data-parity-id="card-badge">New</span>
        <h3 class="card-title" data-parity-id="card-title">Garden room</h3>
        <p class="card-copy" data-parity-id="card-copy">Opens onto the courtyard.</p>
      </a>
    </li>
    <li data-parity-id="cell-2">
      <a class="card" href="/rooms/attic" data-parity-id="card">
        <img class="card-image" src="/images/attic.jpg" alt="Attic skylight" data-parity-id="card-image">
        <h3 class="card-title" data-parity-id="card-title">Attic</h3>
        <p class="card-copy" data-parity-id="card-copy">Under the roof, with a skylight.</p>
      </a>
    </li>
    <li data-parity-id="cell-3">
      <a class="card" href="/rooms/cellar" data-parity-id="card">
        <img class="card-image" src="/images/cellar.jpg" alt="Vaulted cellar" data-parity-id="card-image">
        <h3 class="card-title" data-parity-id="card-title">Cellar</h3>
        <p class="card-copy" data-parity-id="card-copy">Ask us about this room.</p>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
