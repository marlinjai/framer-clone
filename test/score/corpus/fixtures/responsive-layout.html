<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Responsive layout</title>
<style>
  .page { font: 16px/1.5 Arial, sans-serif; color: #111827; padding: 48px; }
  .title { font-size: 40px; line-height: 1.2; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: #f3f4f6; border-radius: 12px; padding: 24px; }
  .card h2 { font-size: 20px; margin: 0 0 8px; }
  .card p { margin: 0; }
  @media (max-width: 1279.98px) {
    .page { padding: 32px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 767.98px) {
    .page { padding: 16px; }
    .title { font-size: 28px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }
</style>
</head>
<body style="margin:0">
<main class="page" data-parity-id="page">
  <h1 class="title" data-parity-id="title">Three plans</h1>
  <section class="grid" data-parity-id="grid">
    <article class="card" data-parity-id="card-1"><h2 data-parity-id="h-1">Small</h2><p data-parity-id="p-1">For one person.</p></article>
    <article class="card" data-parity-id="card-2"><h2 data-parity-id="h-2">Team</h2><p data-parity-id="p-2">For up to ten people.</p></article>
    <article class="card" data-parity-id="card-3"><h2 data-parity-id="h-3">Company</h2><p data-parity-id="p-3">For everybody else.</p></article>
  </section>
</main>
</body>
</html>
